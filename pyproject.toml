[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "couchbase-lm-cache"
dynamic = ["version"]
description = "Couchbase as a shared, persistent KV-cache tier for LMCache and vLLM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Couchbase Ecosystem" }]
keywords = ["couchbase", "lmcache", "vllm", "kv-cache", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "couchbase>=4.6.3,<5",
]

[project.optional-dependencies]
lmcache = ["lmcache>=0.5.6"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "build>=1.2.1",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Couchbase-Ecosystem/couchbase-lm-cache"
Documentation = "https://github.com/Couchbase-Ecosystem/couchbase-lm-cache#readme"
Repository = "https://github.com/Couchbase-Ecosystem/couchbase-lm-cache"
Issues = "https://github.com/Couchbase-Ecosystem/couchbase-lm-cache/issues"
Changelog = "https://github.com/Couchbase-Ecosystem/couchbase-lm-cache/blob/HEAD/CHANGELOG.md"

[tool.hatch.version]
path = "src/couchbase_lm_cache/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/couchbase_lm_cache"]

# Keep the sdist to the package, its tests and docs (not the demo or video).
[tool.hatch.build.targets.sdist]
include = [
  "/src/couchbase_lm_cache",
  "/tests",
  "/examples/store_smoke.py",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# The explainer video's tooling is not part of the package.
extend-exclude = ["video"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: requires a reachable Couchbase Server or Capella cluster",
]
